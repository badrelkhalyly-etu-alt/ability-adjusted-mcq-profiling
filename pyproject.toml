[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcq-profiles"
version = "0.1.0"
description = "Ability-adjusted latent profiling of fixed-form assessments: mixture IRT vs continuous ability, null-calibrated"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "scikit-learn>=1.5", "statsmodels>=0.14",
                "matplotlib>=3.8", "joblib>=1.3", "pyyaml>=6.0", "pyarrow>=15"]

[project.optional-dependencies]
pisa = ["pyreadstat>=1.2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
