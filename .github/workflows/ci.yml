name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: Smoke experiments on synthetic demo data (no PISA data in CI)
        run: |
          python scripts/run_experiments.py --stage fit --demo
          python scripts/run_experiments.py --stage e10 --demo
          python scripts/run_experiments.py --stage null --demo
